# ============================================================
# TurnBasedGameServer_NT — VM1（有状态层 + node-c1 + Nginx）
#   node-c2 在 VM2（10.244.170.211），连接本机对外端口（真分布式）
#   前置：无需本地 JDK/Maven（多阶段构建在容器内完成）
#   启动：docker compose up -d --build
# ============================================================

services:
  mysql:
    image: mysql:9
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD required (see .env.example)}"
      MYSQL_DATABASE: "${DB_NAME:-turn_based_game_nt}"
      MYSQL_USER: "${DB_USER:-tbg_nt}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD required (see .env.example)}"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL 供本机容器网络；EXTERNAL 供跨机客户端（VM2 节点），广播 VM1 外部 IP
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://10.244.216.57:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  redis:
    image: redis:8-alpine
    # 跨机分布式：有状态层端口对 VM2 开放（内网），必须带密码
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required (see .env.example)}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  node1:
    build: .
    image: tbg-server:latest
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: "${DB_NAME:-turn_based_game_nt}"
      DB_USER: "${DB_USER:-tbg_nt}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD required (see .env.example)}"
      # profile yml 的字面密码会覆盖 application.yml 占位符，必须用 Spring 标准变量兜底
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-tbg_nt}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD required (see .env.example)}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD required (see .env.example)}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET required (see .env.example)}"
      NODE_ID: node-c1
      # 集群部署开启严格配置审计（缺 JWT/DB 口令/NODE_ID 即拒绝启动）
      APP_STRICT_CONFIG: "true"
      APP_PORT: "8080"
      MANAGEMENT_PORT: "8081"
      NETTY_WS_PORT: "9510"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_MODULITH_EVENTS_EXTERNALIZATION_ENABLED: "true"
    ports:
      - "8080:8080"
      - "8081:8081"
      - "9510:9510"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  nginx:
    image: nginx:1.27
    # upstream 主机名解析失败时（节点重建窗口）自动重试，节点恢复后自愈
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - node1

volumes:
  mysql-data:
