# ============================================================
# TurnBasedGame_NT 接入层：SSL 卸载 + 负载均衡
#   HTTP  80/443 → node1:8080 / node2:8082（REST API + Web 后台）
#   WS    /ws    → node1:9510 / node2:9511（游戏 WebSocket 通道）
# ============================================================


worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
}

http {
    upstream tbg_api {
        # 开源版被动健康检查：连续 2 次失败拉出 10s
        # 跨机分布式：node-c1 在本机，node-c2 在 VM2（10.244.170.211）
        server node1:8080 max_fails=2 fail_timeout=10s;
        server 10.244.170.211:8082 max_fails=2 fail_timeout=10s;
    }

    upstream tbg_ws {
        server node1:9510 max_fails=2 fail_timeout=10s;
        server 10.244.170.211:9511 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;
        location /ws {
            proxy_pass http://tbg_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location / {
            proxy_pass http://tbg_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 观测 LB 分流（生产可移除）
            add_header X-Game-Upstream $upstream_addr always;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        location /ws {
            proxy_pass http://tbg_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location / {
            proxy_pass http://tbg_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            add_header X-Game-Upstream $upstream_addr always;
        }
    }
}


