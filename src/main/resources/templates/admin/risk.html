<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{admin/fragments :: head('风控事件')}"></head>
<body>
<th:block th:replace="~{admin/fragments :: sidebar('risk')}"></th:block>
<div class="content-wrapper">
    <div class="page-header">
        <h1 class="page-title">风控事件</h1>
        <div class="btn-group">
            <a class="btn btn-sm" th:classappend="${status} == 'OPEN' ? 'btn-primary' : 'btn-outline-primary'"
               th:href="@{'/admin/risk?status=OPEN'}">待处理</a>
            <a class="btn btn-sm" th:classappend="${status} == 'RESOLVED' ? 'btn-primary' : 'btn-outline-primary'"
               th:href="@{'/admin/risk?status=RESOLVED'}">已处理</a>
            <a class="btn btn-sm" th:classappend="${status} == 'DISMISSED' ? 'btn-primary' : 'btn-outline-primary'"
               th:href="@{'/admin/risk?status=DISMISSED'}">已忽略</a>
            <a class="btn btn-sm" th:classappend="${status} == 'ALL' ? 'btn-primary' : 'btn-outline-primary'"
               th:href="@{'/admin/risk?status=ALL'}">全部</a>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                <tr><th>ID</th><th>用户</th><th>类型</th><th>级别</th><th>详情</th><th>状态</th><th>时间</th><th>处置</th></tr>
                </thead>
                <tbody>
                <tr th:each="e : ${events['items']}">
                    <td th:text="${e['id']}"></td>
                    <td th:text="${e['userId']} ?: '-'"></td>
                    <td><code th:text="${e['type']}"></code></td>
                    <td>
                        <span class="badge bg-danger" th:if="${e['severity']} == 'HIGH'">高</span>
                        <span class="badge bg-warning text-dark" th:if="${e['severity']} == 'MEDIUM'">中</span>
                        <span class="badge bg-secondary" th:if="${e['severity']} == 'LOW'">低</span>
                    </td>
                    <td th:text="${e['detail']}"></td>
                    <td th:text="${e['status']}"></td>
                    <td th:text="${#temporals.format(e['createdAt'], 'MM-dd HH:mm:ss')}"></td>
                    <td th:if="${e['status']} == 'OPEN'">
                        <form method="post" th:action="@{'/admin/risk/' + ${e['id']} + '/resolve?status=RESOLVED'}" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-primary">已处理</button>
                        </form>
                        <form method="post" th:action="@{'/admin/risk/' + ${e['id']} + '/resolve?status=DISMISSED'}" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-secondary">忽略</button>
                        </form>
                    </td>
                    <td th:unless="${e['status']} == 'OPEN'">-</td>
                </tr>
                <tr th:if="${#lists.isEmpty(events['items'])}">
                    <td colspan="8" class="text-center text-muted">没有符合条件的事件</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
