<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - 游戏管理后台'">游戏管理后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #5dacdf;
            --sidebar-bg: #2c3e50;
            --sidebar-width: 250px;
            --header-height: 55px;
            --border-color: #dee2e6;
        }

        * {
            border-radius: 0 !important;
            box-shadow: none !important;
            transition: none !important;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #212529;
            overflow-x: hidden;
        }

        .main-header {
            height: var(--header-height);
            background-color: #fff;
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 0; right: 0; left: 0;
            z-index: 1030;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
        }

        .brand-text {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--sidebar-bg);
            text-transform: uppercase;
            width: var(--sidebar-width);
            border-right: 1px solid var(--border-color);
            height: 100%;
            display: flex;
            align-items: center;
            margin-left: -1.5rem;
            padding-left: 1.5rem;
        }

        .main-sidebar {
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            position: fixed;
            top: var(--header-height);
            bottom: 0;
            left: 0;
            z-index: 1020;
            padding-top: 1rem;
        }

        .nav-link {
            color: #b8c7ce;
            padding: 0.8rem 1.5rem;
            display: flex;
            align-items: center;
            font-size: 0.95rem;
            border-left: 3px solid transparent;
        }

        .nav-link:hover { background-color: rgba(255,255,255,0.05); color: #fff; }

        .nav-link.active {
            color: #fff;
            background-color: rgba(255,255,255,0.05);
            border-left-color: var(--primary-color);
            font-weight: 600;
        }

        .nav-link i { margin-right: 0.8rem; font-size: 1.1rem; width: 20px; text-align: center; }

        .content-wrapper {
            margin-top: var(--header-height);
            margin-left: var(--sidebar-width);
            padding: 1.5rem;
            min-height: calc(100vh - var(--header-height));
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .page-title { font-size: 1.5rem; font-weight: 400; margin: 0; }

        .card {
            background: #fff;
            border: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
        }

        .card-header {
            background-color: #f8f9fa;
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1.25rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table { margin-bottom: 0; }

        .table th {
            background-color: #f8f9fa;
            border-bottom: 2px solid var(--border-color);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            color: #495057;
            vertical-align: middle;
        }

        .table td { vertical-align: middle; font-size: 0.9rem; padding: 0.75rem; }

        .table-hover tbody tr:hover { background-color: #f1f3f5; }

        .badge { font-weight: 500; padding: 0.35em 0.65em; }

        .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; text-transform: uppercase; }

        .stat-card {
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 1.25rem;
            display: flex;
            align-items: center;
        }

        .stat-card i {
            font-size: 2rem;
            width: 60px;
            height: 60px;
            line-height: 60px;
            text-align: center;
            background-color: rgba(93, 172, 223, 0.15);
            color: var(--primary-color);
            margin-right: 1rem;
        }

        .stat-value { font-size: 1.5rem; font-weight: 700; }
        .stat-label { font-size: 0.85rem; color: #6c757d; }
    </style>
</head>
<body>

<th:block th:fragment="sidebar(active)">
    <header class="main-header">
        <div class="brand-text">TBG · NT 后台</div>
        <form method="post" action="/admin/logout" class="mb-0">
            <button type="submit" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-box-arrow-right"></i> 退出
            </button>
        </form>
    </header>
    <nav class="main-sidebar">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${active} == 'dashboard' ? 'active'" href="/admin/dashboard">
                    <i class="bi bi-speedometer2"></i> 控制台
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${active} == 'users' ? 'active'" href="/admin/users">
                    <i class="bi bi-people"></i> 玩家管理
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${active} == 'battles' ? 'active'" href="/admin/battles">
                    <i class="bi bi-sword"></i> 战斗记录
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${active} == 'risk' ? 'active'" href="/admin/risk">
                    <i class="bi bi-shield-exclamation"></i> 风控事件
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${active} == 'lua' ? 'active'" href="/admin/lua">
                    <i class="bi bi-code-slash"></i> 战斗公式
                </a>
            </li>
        </ul>
    </nav>
</th:block>

</body>
</html>
